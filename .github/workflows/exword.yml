name: Build EXTune (EX-word)

on:
  push:
    branches: [exword]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exword:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/therainbowphoenix/gint-docker:main
    steps:
      - uses: actions/checkout@v5

      - name: Install EX-word fxSDK and elf2d01
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --branch fix/exword-data-load-alignment https://github.com/TheRainbowPhoenix/fxsdk-exword.git /tmp/fxsdk-src
          cmake -S /tmp/fxsdk-src -B /tmp/fxsdk-build -DCMAKE_INSTALL_PREFIX=/tmp/fxsdk-exword -DFXLINK_DISABLE_SDL2=ON -DFXLINK_DISABLE_UDISKS2=ON
          cmake --build /tmp/fxsdk-build --parallel 2
          cmake --install /tmp/fxsdk-build
          git clone --depth=1 https://github.com/brijohn/elf2d01.git /tmp/elf2d01
          cc -O2 /tmp/elf2d01/elf2d01.c -o /tmp/fxsdk-exword/bin/elf2d01
          echo /tmp/fxsdk-exword/bin >> "$GITHUB_PATH"

      - name: Build gint EX-word runtime
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --branch feature/exword-runtime-bridge https://github.com/TheRainbowPhoenix/gint-exword.git /tmp/gint-src
          cmake -S /tmp/gint-src -B /tmp/gint-build -DCMAKE_TOOLCHAIN_FILE=/tmp/fxsdk-exword/lib/cmake/fxsdk/EXWORD.cmake -DCMAKE_INSTALL_PREFIX=/tmp/gint-exword -DCMAKE_MODULE_PATH=/tmp/fxsdk-exword/lib/cmake/fxsdk
          cmake --build /tmp/gint-build --parallel 2
          cmake --install /tmp/gint-build

      - name: Build and install JustUI for EX-word
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --branch dev https://github.com/TheRainbowPhoenix/JustUI-exword.git /tmp/justui-src
          cmake -S /tmp/justui-src -B /tmp/justui-build \
            -DCMAKE_TOOLCHAIN_FILE=/tmp/fxsdk-exword/lib/cmake/fxsdk/EXWORD.cmake \
            -DCMAKE_INSTALL_PREFIX=/tmp/justui-exword \
            -DCMAKE_PREFIX_PATH=/tmp/gint-exword \
            '-DCMAKE_MODULE_PATH=/tmp/gint-exword/lib/cmake/fxsdk;/tmp/fxsdk-exword/lib/cmake/fxsdk'
          cmake --build /tmp/justui-build --parallel 2
          cmake --install /tmp/justui-build

      - name: Build EXTune and EX-word installation packages
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --branch main https://github.com/TheRainbowPhoenix/exword-xd-a8500-TEST.git /tmp/exword-metadata
          cmake -S . -B build-exword \
            -DCMAKE_TOOLCHAIN_FILE=/tmp/fxsdk-exword/lib/cmake/fxsdk/EXWORD.cmake \
            '-DCMAKE_PREFIX_PATH=/tmp/gint-exword;/tmp/justui-exword' \
            '-DCMAKE_MODULE_PATH=/tmp/gint-exword/lib/cmake/fxsdk;/tmp/justui-exword/lib/cmake/fxsdk;/tmp/fxsdk-exword/lib/cmake/fxsdk' \
            -DEXWORD_METADATA_SOURCE=/tmp/exword-metadata
          cmake --build build-exword --parallel 2
          test -s build-exword/extune00.d01
          test "$(stat -c %s build-exword/extune00.d01)" -le 131072
          test -s build-exword/extprb00.d01
          test "$(stat -c %s build-exword/extprb00.d01)" -le 131072
          # Match the working Explorer's lower-case 8.3 filenames and
          # 6-byte internal module headers, plus the 0x80 byte entry offset.
          python3 - <<'PY'
          from pathlib import Path
          import struct
          import subprocess

          builds = [
              ("extune00", "extune", "EXTUN", "extune"),
              ("extprb00", "extprb", "EXPRB", "extune_probe"),
          ]
          for basename, module, appid, elf_file in builds:
              d01 = Path("build-exword") / (basename + ".d01")
              image = d01.read_bytes()
              assert len(basename) == 8 and basename.isascii()
              assert image[:16] == b"CASIODICPLUGIN10", (basename, image[:16])
              assert image[16:22] == module.encode("ascii")
              # Header fields follow the legacy elf2d01 128-byte ABI:
              # 0x2c = ROM base; 0x30 = RAM base; 0x34 = RAM size.
              assert image[44:48] == struct.pack(">I", 0x70000000)
              assert image[48:52] == struct.pack(">I", 0x74000000)
              assert image[52:56] == struct.pack(">I", 0x00008000)
              assert 128 < len(image) <= 131072
              elf = Path("build-exword") / elf_file
              header = subprocess.check_output(
                  ["sh-elf-readelf", "-h", str(elf)], text=True)
              assert "0x70000080" in header
              for locale, info in [("cn", "infgtcn3.htm"),
                                   ("ja", "infogt5.htm")]:
                  package = Path("build-exword/packages") / locale / appid
                  assert (package / d01.name).read_bytes() == image
                  metadata = (package / info).read_text()
                  assert f'addin="ON,{basename}.d01"' in metadata
                  assert (package / "diction.htm").is_file()
                  assert (package / "fileinfo.cji").is_file()
              print(f"{basename}.d01: header, entry, CN/JA metadata OK")
          PY
          for locale in ja cn; do
            package="build-exword/packages/${locale}/EXTUN"
            test -s "$package/extune00.d01"
            test -s "$package/diction.htm"
            test -f "$package/fileinfo.cji"
            probe="build-exword/packages/${locale}/EXPRB"
            test -s "$probe/extprb00.d01"
            test -s "$probe/diction.htm"
            test -f "$probe/fileinfo.cji"
          done

      - name: Upload EX-word packages and diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EXTune-exword
          path: |
            build-exword/extune00.d01
            build-exword/extprb00.d01
            build-exword/packages/
            build-exword/extune
            build-exword/extune.map
            build-exword/extune_probe
            build-exword/extune_probe.map
          if-no-files-found: warn
          retention-days: 14
